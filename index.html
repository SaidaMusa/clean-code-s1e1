<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>

  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <img class="header__image" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix infographic">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>

  <main class="main" role="main">
    <section aria-labelledby="add-label">
      <h3 id="add-label">Add Item</h3>
      <form class="task-row-wrapper" id="add-form" autocomplete="off">
        <input id="new-task" class="task" type="text" placeholder="Enter a new task" aria-describedby="add-label">
        <button type="submit">Add</button>
      </form>
    </section>

    <section aria-labelledby="todo-title">
      <h3 id="todo-title">Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task">
          <button type="button" class="edit">Edit</button>
          <button type="button" class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="completed-title">
      <h3 id="completed-title">Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked>
          <label class="task">See the Doctor</label>
          <input type="text" class="task">
          <button type="button" class="edit">Edit</button>
          <button type="button" class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p class="footer__text">© 2025 Todo App</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
